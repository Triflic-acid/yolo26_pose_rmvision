#用于地面单位的增强训练

data: armor_pose_v2.yaml
model: runs/pose/RMStage2-1/weights/best.pt   # 微调：指向已有权重
resume: null
device: auto

output:
  project: runs/pose
  name: v2_finetune        # 每次训练独立目录，别复用
  exist_ok: false

train:
  epochs: 30
  patience: 30
  imgsz: 640
  batch: 16
  workers: 4
  fraction: 1.0
  cache: false
  seed: 42
  deterministic: true
  plots: true
  val: true
  save: true
  verbose: true
  optimizer: SGD
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 3
  cos_lr: true
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  flipud: 0.0
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 5